name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutor:
    name: App tutor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter petlive-tutor typecheck

      - name: Lint
        run: pnpm --filter petlive-tutor lint

      - name: Testes unitários
        run: pnpm --filter petlive-tutor test

  web:
    name: Site e painel web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm exec eslint .

      # LayoutProps e PageProps são gerados pelo Next; sem isto o tsc não os encontra.
      - name: Gerar tipos das rotas
        working-directory: apps/web
        run: pnpm exec next typegen

      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm exec next build

  database:
    name: Migrations e schema Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations no banco local
        run: supabase db start

      - name: Validar funções e schema
        run: supabase db lint --local --fail-on error
