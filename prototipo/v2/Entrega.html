<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Entrega ou retirada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="Solicitar.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Como receber?</h1></div>

<div class="pilha"><div class="cartao" style="display:flex;align-items:center;gap:12px;border:2px solid transparent;padding:14px 16px"><span style="width:22px;height:22px;border-radius:50%;border:2px solid var(--linha);flex:none"></span><span class="icone neutro"><i class="ph ph-storefront"></i></span><div style="flex:1"><b style="font-size:15px">Retirar na loja</b><p class="sub" style="font-size:13px">Grátis · pronto em 30 min</p></div></div><div class="cartao" style="display:flex;align-items:center;gap:12px;border:2px solid var(--tinta);padding:14px 16px"><span style="width:22px;height:22px;border-radius:50%;border:7px solid var(--tinta);flex:none"></span><span class="icone neutro"><i class="ph ph-moped"></i></span><div style="flex:1"><b style="font-size:15px">Entrega</b><p class="sub" style="font-size:13px">Chega em 40 a 60 min</p></div><b class="num" style="font-size:15px">R$ 8,90</b></div></div>
<div class="secao"><h2>Endereço</h2></div>
<div class="lista"><div class="linha-item"><span class="icone lugar"><i class="ph ph-house"></i></span><div class="texto"><b>Casa</b><small>Rua Uruguai, 380 · Tijuca</small></div><span style="font-size:13px;font-weight:700;color:var(--ceu-texto)">Trocar</span></div></div>
<div class="cartao" style="margin-top:10px">
  <div style="display:flex;justify-content:space-between;font-size:14px"><b>Faltam R$ 10,10 para frete grátis</b><b class="num">95%</b></div>
  <div style="height:10px;border-radius:999px;background:var(--papel);margin-top:10px;overflow:hidden"><span style="display:block;width:95%;height:100%;background:var(--verde);border-radius:999px"></span></div>
  <p class="sub num" style="font-size:12px;margin-top:8px">Taxa para a Tijuca · pedido mínimo atingido</p>
</div>
<div style="height:16px"></div>
<div class="abas" style="margin-bottom:16px"><a class="ativa">Agora</a><a>Agendar</a></div>
<label class="campo"><span>Recado para o entregador (opcional)</span><div class="valor num">Interfone 302</div></label>

</div>

<div style="position:absolute;left:12px;right:12px;bottom:20px;background:var(--tinta);color:#fff;border-radius:28px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><small style="font-size:12px;color:#C9D0DB;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Total com entrega</small><b class="num" style="font-size:18px">R$ 198,80</b></div><a href="Pagamento.html" class="botao ceu tocavel" style="width:auto;padding:0 20px;flex:none">Continuar</a></div>
</div>
</body>
</html>
