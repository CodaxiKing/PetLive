<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Painel admin, entrar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="web.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela-web">
<div class="foto" style="width:620px;flex:none;background-image:url('https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=900&q=70&auto=format&fit=crop');position:relative">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,23,38,.1),rgba(14,23,38,.75))"></div>
  <div style="position:absolute;left:44px;top:40px;display:flex;align-items:center;gap:10px;color:#fff"><img src="logo-petlive.png" alt="PetLive" style="width:38px;height:38px;flex:none;display:block"><b style="font-size:19px">PetLive</b><span class="selo" style="background:rgba(255,255,255,.16);color:#fff">Admin</span></div>
  <div style="position:absolute;left:44px;right:60px;bottom:48px;color:#fff"><b style="display:block;font-size:40px;line-height:1.08;letter-spacing:-0.035em">O PetLive em um só painel</b><p style="margin:12px 0 0;font-size:16px;color:#D8DEE8;max-width:420px">Assinaturas, avaliações, pedidos e lojas. Acesso só para a equipe.</p></div>
</div>
<div style="flex:1;display:grid;place-items:center">
  <div style="width:400px">
    <h1 style="margin:0;font-size:30px;letter-spacing:-0.03em">Entrar</h1>
    <p class="sub" style="margin:4px 0 24px">Use o e-mail da equipe PetLive.</p>
    <div style="display:grid;gap:14px">
      <label class="campo-w"><span>E-mail</span><div>helena@petlive.com.br</div></label>
      <label class="campo-w"><span>Senha</span><div><span style="flex:1;letter-spacing:.2em">••••••••••</span><span style="font-size:13px;font-weight:700;color:var(--ceu-texto)">Mostrar</span></div></label>
      <div><span style="display:block;font-size:12px;font-weight:600;color:var(--suave);margin:0 2px 6px">Código do app autenticador</span>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><span class="num" style="height:52px;border-radius:14px;border:1.5px solid var(--linha);background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700">4</span><span class="num" style="height:52px;border-radius:14px;border:1.5px solid var(--linha);background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700">8</span><span class="num" style="height:52px;border-radius:14px;border:1.5px solid var(--linha);background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700">2</span><span class="num" style="height:52px;border-radius:14px;border:1.5px solid var(--tinta);background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700"></span><span class="num" style="height:52px;border-radius:14px;border:1.5px solid var(--linha);background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700"></span><span class="num" style="height:52px;border-radius:14px;border:1.5px solid var(--linha);background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700"></span></div>
      <p class="sub" style="font-size:12px;margin:6px 2px 0">Abra o autenticador no celular e digite os 6 números.</p></div>
    </div>
    <a href="AdminVisao.html" class="botao" style="margin-top:22px">Entrar no painel</a>
    <p class="sub" style="font-size:13px;margin-top:14px;text-align:center">Esqueceu a senha? Fale com um super admin.</p>
  </div>
</div></div>
</body>
</html>
