<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Criar conta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">

<div class="rolagem sobe">
  <div class="topo"><a href="BoasVindas.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a></div>
  <h1 class="titulo">Criar sua conta</h1>
  <p class="sub" style="margin:8px 0 22px">Leva um minuto. Depois você cadastra o seu pet.</p>
  <a href="CadastroPet.html" class="botao claro tocavel" style="margin-bottom:18px"><i class="ph ph-google-logo" style="font-size:20px"></i>Continuar com Google</a>
  <div style="display:flex;align-items:center;gap:12px;margin:0 4px 18px;color:var(--fraco);font-size:13px;font-weight:600"><span style="flex:1;height:1px;background:var(--linha)"></span>ou com e-mail<span style="flex:1;height:1px;background:var(--linha)"></span></div>
  <label class="campo"><span>Nome</span><input value="Diego"></label>
  <label class="campo"><span>E-mail</span><input value="diego@email.com" type="email"></label>
  <label class="campo"><span>Senha</span><input value="minhasenha" type="password"><em>Pelo menos 8 caracteres.</em></label>
  <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--suave);margin:6px 4px 0"><span style="width:22px;height:22px;border-radius:7px;background:var(--tinta);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px"><i class="ph-bold ph-check" style="font-size:13px"></i></span><span>Li e aceito os <b style="color:var(--tinta)">termos de uso</b> e a <b style="color:var(--tinta)">política de privacidade</b>.</span></label>
</div>
<div class="rodape"><a href="CadastroPet.html" class="botao tocavel">Criar conta</a></div>
</div>
</body>
</html>
