<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="TodosAtalhos.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Calculadoras</h1></div>

<div class="abas" style="margin-bottom:16px"><a class="ativa">Ração</a><a>Idade</a><a>Peso</a></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Pet</span><div class="valor num">Rex · cão</div></label><label class="campo"><span>Peso</span><div class="valor num">12,4 kg</div></label></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Fase</span><div class="valor num">Adulto</div></label><label class="campo"><span>Atividade</span><div class="valor num">Normal</div></label></div>
<div class="cartao" style="background:var(--tinta);color:#fff;margin-top:4px">
  <small style="font-size:13px;color:#C9D0DB">Porção diária estimada</small>
  <b class="num" style="display:block;font-size:40px;letter-spacing:-0.04em;margin:4px 0">190 g</b>
  <p class="num" style="margin:0;font-size:13px;color:#C9D0DB">Em 2 refeições de cerca de 95 g</p>
</div>
<p class="sub" style="font-size:12px;margin:14px 4px 0">São estimativas para ração seca padrão. Siga a embalagem e a orientação do veterinário.</p>

</div>
<div class="rodape"><a class="botao tocavel ">Calcular</a></div>

</div>
