<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>QR da coleira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="CompartilharOpcoes.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>QR da coleira</h1></div>

<div class="cartao" style="display:flex;flex-direction:column;align-items:center;padding:24px;background:var(--tinta);color:#fff">
  <div style="width:180px;height:180px;border-radius:24px;background:#fff;display:grid;place-items:center;color:var(--tinta)"><i class="ph ph-qr-code" style="font-size:150px"></i></div>
  <b style="font-size:20px;margin-top:14px">Rex</b><p style="margin:2px 0 0;font-size:13px;color:#C9D0DB">petlive.app/r/rex</p>
</div>
<p class="sub" style="margin:14px 2px">Quem escanear vê só o que estiver ligado, sem precisar do app.</p>
<div class="lista"><div class="linha-item"><span class="icone neutro"><i class="ph ph-image"></i></span><div class="texto"><b>Nome e foto do pet</b></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div><div class="linha-item"><span class="icone neutro"><i class="ph ph-phone"></i></span><div class="texto"><b>Telefone do tutor</b></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div><div class="linha-item"><span class="icone saude"><i class="ph ph-first-aid"></i></span><div class="texto"><b>Alergias e saúde</b></div><span style="width:48px;height:28px;border-radius:999px;background:#D5DAE2;position:relative;flex:none"><span style="position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div></div>
<a href="Encontrado.html" style="display:block;text-align:center;margin-top:14px;font-weight:700;font-size:14px;color:var(--ceu-texto)">Ver o que aparece ao escanear</a>

</div>
<div class="rodape"><a class="botao tocavel "><i class="ph ph-download-simple"></i>Baixar etiqueta</a></div>

</div>
</body>
</html>
