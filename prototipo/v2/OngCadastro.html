<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cadastro da ONG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="Adocao.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Sou de uma ONG</h1></div>

<label class="campo"><span>Nome da ONG ou do abrigo</span><div class="valor num">Patas do Rio</div></label>
<label class="campo"><span>CNPJ</span><div class="valor num">12.345.678/0001-95</div></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Cidade</span><div class="valor num">Rio de Janeiro</div></label><label class="campo"><span>Bairro</span><div class="valor num">Tijuca</div></label></div>
<label class="campo"><span>Responsável</span><div class="valor num">Marina Couto · (21) 99234-1180</div></label>
<div class="secao"><h2>Documentos</h2></div>
<div class="lista"><div class="linha-item"><span class="icone neutro"><i class="ph ph-file-text"></i></span><div class="texto"><b>Estatuto ou ato constitutivo</b></div><span class="selo ok"><i class="ph-bold ph-check"></i>Enviado</span></div><div class="linha-item"><span class="icone neutro"><i class="ph ph-file-text"></i></span><div class="texto"><b>Comprovante de endereço</b></div><span class="botao claro pequeno" style="height:34px;box-shadow:none;background:var(--papel)">Enviar</span></div></div>
<p class="sub" style="font-size:12px;margin:14px 4px 0">A análise leva até 3 dias úteis. Só ONGs verificadas publicam pets. O PetLive não vende animais e não cobra pela adoção.</p>

</div>
<div class="rodape"><a class="botao tocavel ">Enviar para análise</a></div>

</div>
</body>
</html>
