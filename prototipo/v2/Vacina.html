<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Registrar vacina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">

<div class="rolagem sobe">
  <div class="topo"><a href="Pet.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Registrar vacina</h1></div>
  <span style="display:block;font-size:13px;font-weight:600;color:var(--suave);margin:0 4px 8px">Vacina</span>
  <div class="chips" style="margin-bottom:18px"><span class="chip ativo">V10</span><span class="chip">V8</span><span class="chip">Antirrábica</span><span class="chip">Giárdia</span><span class="chip">Gripe</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <label class="campo"><span>Aplicada em</span><div class="valor num">29/10/2026</div></label>
    <label class="campo"><span>Próxima dose</span><div class="valor num">29/10/2027</div></label>
  </div>
  <p class="sub" style="font-size:12px;margin:-6px 4px 16px"><i class="ph ph-sparkle"></i> Sugerimos 1 ano, pelo calendário do cão adulto.</p>
  <label class="campo"><span>Lote</span><input placeholder="Opcional"></label>
  <label class="campo"><span>Veterinário ou clínica</span><input placeholder="Opcional"></label>
  <div class="cartao" style="display:flex;align-items:center;gap:12px;background:var(--lilas-fundo);box-shadow:none"><span class="icone" style="background:#fff;color:var(--lilas)"><i class="ph ph-bell-ringing"></i></span><div style="flex:1"><b style="font-size:15px">Lembrar da próxima dose</b><p class="sub" style="font-size:13px;color:var(--lilas)">7 dias antes e no dia</p></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div>
</div>
<div class="rodape"><a href="Pet.html" class="botao tocavel">Salvar vacina</a></div>
</div>
</body>
</html>
