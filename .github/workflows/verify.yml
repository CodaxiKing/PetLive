# Roda o `pnpm verify:supabase` (critérios A e C) em cada push e em cada PR,
# para o QA ter a saída sem precisar de shell: o docs/qa/verify-saida.txt vai
# como comentário no PR (atualizado a cada push), no resumo do run, como
# artefato e versionado na própria branch (para quem só lê o repositório). O
# push em qualquer branch também versiona: a branch recebe a saída mesmo
# antes de o PR existir.
name: verify

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # commit do docs/qa/verify-saida.txt na branch do PR
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # O último commit do PR, e não o merge com a main: o commit que a saída
      # registra na primeira linha precisa ser o que o QA vê no PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local
        run: supabase start
      - name: pnpm verify:supabase
        run: pnpm verify:supabase
      - name: Saída do verify no resumo do run
        if: always()
        run: |
          {
            echo '### Saída do `pnpm verify:supabase`'
            echo '```'
            tail -c 60000 docs/qa/verify-saida.txt 2>/dev/null || echo '(sem saída: o verify não chegou a rodar)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Saída do verify no PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # PR de fork recebe token só de leitura
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marca = '<!-- petlive-verify -->'
            let saida = '(sem saída: o verify não chegou a rodar)'
            try { saida = fs.readFileSync('docs/qa/verify-saida.txt', 'utf8') } catch {}
            const resultado = /^Tudo certo/m.test(saida) ? '✅ passou' : '❌ falhou'
            const corpo = [
              marca,
              `### pnpm verify:supabase: ${resultado}`,
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '<details><summary>Saída completa</summary>',
              '',
              '```',
              saida.slice(-60000),
              '```',
              '</details>',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const anterior = comentarios.find((c) => c.body?.includes(marca))
            if (anterior) await github.rest.issues.updateComment({ owner, repo, comment_id: anterior.id, body: corpo })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: corpo })
      # Commit só com o verify-saida.txt, em cima do commit verificado. Push com o
      # GITHUB_TOKEN não dispara outro workflow, então não entra em loop. Se a
      # branch andou durante o run (inclusive pelo run gêmeo push/pull_request),
      # o push é recusado e vale o commit que já entrou. A main não recebe.
      - name: Versionar a saída do verify na branch
        if: >-
          always() && (
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
            ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch' && github.ref_name != 'main')
          )
        continue-on-error: true
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          VERIFICADO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f docs/qa/verify-saida.txt || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/qa/verify-saida.txt
          git diff --cached --quiet && exit 0
          git commit -m "docs(qa): saída do pnpm verify:supabase em ${VERIFICADO::7}"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Anexar a saída do verify
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-saida
          path: docs/qa/verify-saida.txt
          if-no-files-found: warn
