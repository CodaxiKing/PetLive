packages:
  - "apps/*"

# Nomes curtos em node_modules/.pnpm: no Windows o build nativo do Android
# (CMake/ninja) falha com caminhos acima de 260 caracteres.
virtualStoreDirMaxLength: 30

# Expo UI traz React DOM como peer opcional; manter a mesma versão de React
# usada pelo SDK 58 e pelo web, sem instalar 19.3.1 com React 19.3.0.
overrides:
  react-dom: 19.3.0

# Builds de dependências com script de instalação.
# unrs-resolver é o resolver nativo do ESLint (eslint-config-expo).
allowBuilds:
  '@sentry/cli': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
  - expo-router@58.0.24
  - expo-location@58.0.18
