<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111}
input{font-family:inherit}
a{text-decoration:none;color:inherit}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2.5%}}
@keyframes sway{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
div[style*="border-radius:2"][style*="padding"],div[style*="border-radius:3"][style*="padding"]{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
div[style*="border-radius:2"][style*="padding"]:nth-child(2),div[style*="border-radius:3"][style*="padding"]:nth-child(2){animation-delay:.08s}
div[style*="border-radius:2"][style*="padding"]:nth-child(3),div[style*="border-radius:3"][style*="padding"]:nth-child(3){animation-delay:.16s}
div[style*="border-radius:2"][style*="padding"]:nth-child(4),div[style*="border-radius:3"][style*="padding"]:nth-child(4){animation-delay:.24s}
div[style*="border-radius:2"][style*="padding"]:nth-child(5),div[style*="border-radius:3"][style*="padding"]:nth-child(5){animation-delay:.32s}
svg[viewBox="0 0 200 200"]{animation:bob 3.4s ease-in-out infinite}
svg[stroke="#fff"][viewBox="0 0 24 24"]{transform-origin:50% 50%;animation:sway 5s ease-in-out infinite}
circle[fill-opacity]{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
polyline[stroke="#111"]{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s .25s ease-out forwards}
div[style*="border-radius:4px"][style*="width:"]{transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.7,.2,1) both}
a{transition:transform .18s ease}
a[style*="border-radius:32px"]:hover,a[style*="border-radius:28px"]:hover{transform:translateY(-2px)}
a[style*="border-radius:32px"]:active,a[style*="border-radius:28px"]:active{transform:scale(.97)}
nav a:hover{transform:translateY(-3px)}
}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;overflow:hidden">
  <div style="position:relative;height:290px;background:#9AD6F8;flex:none;overflow:hidden">
    <span style="position:absolute;left:24px;top:58px;background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;z-index:1">Passo 1 de 2</span>
    <svg style="position:absolute;right:20px;top:40px" width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="18" cy="10" r="1.8"/><path d="M12 12c-3 0-5 2.5-5 4.5 0 1.5 1.2 2 2.6 2 1 0 1.6-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.5 2.6-2 0-2-2-4.5-5-4.5z"/></svg>
    <svg style="position:absolute;left:50%;bottom:10px;transform:translateX(-50%)" width="250" height="250" viewBox="0 0 200 200" aria-hidden="true"><path d="M52 150Q100 190 148 150L170 200H30z" fill="#E3AD6A"/><path d="M50 58C26 68 22 122 40 146C58 146 64 102 64 70z" fill="#B97A3C"/><path d="M150 58C174 68 178 122 160 146C142 146 136 102 136 70z" fill="#B97A3C"/><ellipse cx="100" cy="92" rx="52" ry="56" fill="#EDB878"/><ellipse cx="100" cy="120" rx="30" ry="24" fill="#F8E3C0"/><ellipse cx="100" cy="104" rx="11" ry="7.5" fill="#2A211C"/><path d="M100 111v10M88 124c6 8 18 8 24 0" fill="none" stroke="#2A211C" stroke-width="3" stroke-linecap="round"/><path d="M94 127c1 14 11 14 12 0z" fill="#F28B8B"/><circle cx="79" cy="82" r="6.5" fill="#2A211C"/><circle cx="121" cy="82" r="6.5" fill="#2A211C"/><circle cx="81" cy="80" r="2" fill="#fff"/><circle cx="123" cy="80" r="2" fill="#fff"/><path d="M54 152Q100 182 146 152L150 166Q100 196 50 166z" fill="#FF7A7A"/></svg>
    <div style="position:absolute;right:86px;bottom:52px;width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </div>
    <svg style="position:absolute;left:0;bottom:-1px" width="390" height="46" viewBox="0 0 390 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46V26C28 8 56 10 80 24C104 38 132 40 154 26C180 8 214 10 238 26C262 42 300 38 322 22C346 6 372 12 390 24V46z" fill="#fff"/></svg>
  </div>

  <div style="flex:1;padding:0 24px 28px;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;font-weight:500;font-size:34px;line-height:1.05;letter-spacing:-0.03em">Conheça seu pet</h1>

    <div style="background:#EEF1F5;border-radius:28px;padding:8px 22px 10px;display:flex;flex-direction:column">
      <label for="nome" style="font-size:12px;font-weight:600;color:#566070">Nome</label>
      <input id="nome" type="text" placeholder="Ex.: Rex" style="border:0;background:transparent;outline:0;font-size:17px;font-weight:600;padding:2px 0;height:28px">
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="height:60px;border-radius:30px;background:#111;color:#fff;display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:600;font-size:16px">
        <span style="width:44px;height:44px;border-radius:50%;background:#9AD6F8;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none"><svg width="44" height="44" viewBox="0 0 200 200" aria-hidden="true"><path d="M52 150Q100 190 148 150L170 200H30z" fill="#E3AD6A"/><path d="M50 58C26 68 22 122 40 146C58 146 64 102 64 70z" fill="#B97A3C"/><path d="M150 58C174 68 178 122 160 146C142 146 136 102 136 70z" fill="#B97A3C"/><ellipse cx="100" cy="92" rx="52" ry="56" fill="#EDB878"/><ellipse cx="100" cy="120" rx="30" ry="24" fill="#F8E3C0"/><ellipse cx="100" cy="104" rx="11" ry="7.5" fill="#2A211C"/><circle cx="79" cy="82" r="7" fill="#2A211C"/><circle cx="121" cy="82" r="7" fill="#2A211C"/></svg></span>Cão
      </div>
      <div style="height:60px;border-radius:30px;background:#fff;border:1.5px solid #E1E6EE;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:600;font-size:16px">
        <span style="width:44px;height:44px;border-radius:50%;background:#EADCFB;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none"><svg width="44" height="44" viewBox="0 0 200 200" aria-hidden="true"><path d="M30 200Q36 150 100 150Q164 150 170 200z" fill="#E88F45"/><path d="M46 78L52 24L96 54z" fill="#E88F45"/><path d="M154 78L148 24L104 54z" fill="#E88F45"/><ellipse cx="100" cy="98" rx="58" ry="52" fill="#F2A65A"/><ellipse cx="100" cy="120" rx="22" ry="15" fill="#FBE3CC"/><ellipse cx="76" cy="94" rx="8" ry="10" fill="#3E8E6A"/><ellipse cx="124" cy="94" rx="8" ry="10" fill="#3E8E6A"/></svg></span>Gato
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="background:#F3F5F8;border-radius:24px;padding:12px 18px;display:flex;flex-direction:column;min-width:0">
        <label for="raca" style="font-size:12px;font-weight:600;color:#566070">Raça</label>
        <input id="raca" type="text" placeholder="Labrador" style="border:0;background:transparent;outline:0;font-size:17px;font-weight:600;padding:2px 0;height:28px;min-width:0">
      </div>
      <div style="background:#F3F5F8;border-radius:24px;padding:12px 18px;display:flex;flex-direction:column;min-width:0">
        <label for="nasc" style="font-size:12px;font-weight:600;color:#566070">Nascimento</label>
        <input id="nasc" type="text" placeholder="dd/mm/aaaa" style="border:0;background:transparent;outline:0;font-size:17px;font-weight:600;padding:2px 0;height:28px;min-width:0">
      </div>
    </div>

    <a href="Inicio.dc.html" style="margin-top:auto;height:64px;border-radius:32px;background:#111;color:#fff;display:flex;align-items:center;padding:0 6px">
      <span style="width:52px;height:52px;border-radius:50%;background:#9AD6F8;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="#111" aria-hidden="true"><circle cx="6" cy="10" r="1.9"/><circle cx="10" cy="6" r="1.9"/><circle cx="14" cy="6" r="1.9"/><circle cx="18" cy="10" r="1.9"/><path d="M12 12c-3 0-5 2.5-5 4.5 0 1.5 1.2 2 2.6 2 1 0 1.6-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.5 2.6-2 0-2-2-4.5-5-4.5z"/></svg></span>
      <span style="flex:1;text-align:center;font-weight:600;font-size:17px">Continuar</span>
      <span style="width:44px;display:flex;justify-content:center;opacity:0.5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6l6 6-6 6M13 6l6 6-6 6"/></svg></span>
    </a>
  </div>
