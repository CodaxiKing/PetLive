<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lojista, creche</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="Catalogo.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Creche pet</h1></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="cartao" style="position:relative;padding:14px"><span style="position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center"><i class="ph ph-check" style=font-size:13px></i></span><b style="font-size:15px">Dia inteiro</b><small class="sub" style="display:block;font-size:12px">8h às 18h</small><b class="num" style="display:block;font-size:22px;margin-top:8px">R$ 80</b></div><div class="cartao" style="position:relative;padding:14px"><span style="position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center"><i class="ph ph-check" style=font-size:13px></i></span><b style="font-size:15px">Meio período</b><small class="sub" style="display:block;font-size:12px">Manhã ou tarde</small><b class="num" style="display:block;font-size:22px;margin-top:8px">R$ 50</b></div></div>
<div style="height:10px"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Entrada até</span><div class="valor num">09:00</div></label><label class="campo"><span>Retirada a partir de</span><div class="valor num">17:00</div></label></div>
<div class="lista"><div class="linha-item"><span class="icone rotina"><i class="ph ph-users-three"></i></span><div class="texto"><b>Vagas por dia</b></div><span style="display:inline-flex;align-items:center;gap:12px;background:var(--papel);border-radius:999px;padding:3px"><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff"><i class="ph ph-minus"></i></span><b class="num">12</b><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tinta);color:#fff"><i class="ph ph-plus"></i></span></span></div></div>
<small style="display:block;font-size:13px;font-weight:600;color:var(--suave);margin:16px 4px 8px">Dias de funcionamento</small>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tinta);color:#fff;box-shadow:var(--sombra)">S</span><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tinta);color:#fff;box-shadow:var(--sombra)">T</span><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tinta);color:#fff;box-shadow:var(--sombra)">Q</span><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tinta);color:#fff;box-shadow:var(--sombra)">Q</span><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tinta);color:#fff;box-shadow:var(--sombra)">S</span><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff;color:var(--suave);box-shadow:var(--sombra)">S</span><span style="height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff;color:var(--suave);box-shadow:var(--sombra)">D</span></div>
<div style="height:14px"></div>
<div class="lista"><div class="linha-item"><span class="icone rotina"><i class="ph ph-package"></i></span><div class="texto"><b>Pacotes do mês</b><small>8 ou 12 diárias com desconto</small></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div><div class="linha-item"><span class="icone saude"><i class="ph ph-syringe"></i></span><div class="texto"><b>Exigir vacinas em dia</b><small>Confere a carteirinha no app</small></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div></div>

</div>
<div class="rodape"><a class="botao tocavel ">Salvar serviço</a></div>

</div>
</body>
</html>
