<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lojista, passeador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="Catalogo.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Passeador</h1></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="cartao" style="position:relative;padding:14px"><span style="position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center"><i class="ph ph-check" style=font-size:13px></i></span><b style="font-size:15px">30 min</b><small class="sub" style="display:block;font-size:12px">Passeio curto</small><b class="num" style="display:block;font-size:22px;margin-top:8px">R$ 30</b></div><div class="cartao" style="position:relative;padding:14px"><span style="position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center"><i class="ph ph-check" style=font-size:13px></i></span><b style="font-size:15px">60 min</b><small class="sub" style="display:block;font-size:12px">Passeio longo</small><b class="num" style="display:block;font-size:22px;margin-top:8px">R$ 50</b></div></div>
<div style="height:10px"></div>
<div class="lista"><div class="linha-item"><span class="icone rotina"><i class="ph ph-circle-dashed"></i></span><div class="texto"><b>Raio de atuação</b><small>5 km da loja</small></div><span style="display:inline-flex;align-items:center;gap:12px;background:var(--papel);border-radius:999px;padding:3px"><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff"><i class="ph ph-minus"></i></span><b class="num">5</b><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tinta);color:#fff"><i class="ph ph-plus"></i></span></span></div><div class="linha-item"><span class="icone rotina"><i class="ph ph-dog"></i></span><div class="texto"><b>Pets por passeio</b><small>No máximo</small></div><span style="display:inline-flex;align-items:center;gap:12px;background:var(--papel);border-radius:999px;padding:3px"><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff"><i class="ph ph-minus"></i></span><b class="num">3</b><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tinta);color:#fff"><i class="ph ph-plus"></i></span></span></div><div class="linha-item"><span class="icone rotina"><i class="ph ph-clock"></i></span><div class="texto"><b>Janela de passeios</b><small>07:00 às 19:00, a cada 30 min</small></div><i class="ph ph-caret-right seta"></i></div></div>
<div style="height:14px"></div>
<div class="abas" style="margin-bottom:14px"><a class="ativa">Na casa do tutor</a><a>Ponto combinado</a></div>
<div class="lista"><div class="linha-item"><span class="icone rotina"><i class="ph ph-path"></i></span><div class="texto"><b>Enviar trajeto e fotos</b><small>O tutor acompanha pelo app</small></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div></div>

</div>
<div class="rodape"><a class="botao tocavel ">Salvar serviço</a></div>

</div>
</body>
</html>
