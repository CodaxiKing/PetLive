name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutor:
    name: App tutor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter petlive-tutor typecheck

      - name: Lint
        run: pnpm --filter petlive-tutor lint

      - name: Testes unitários
        run: pnpm --filter petlive-tutor test

  web:
    name: Site e painel web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm exec eslint .

      # LayoutProps e PageProps são gerados pelo Next; sem isto o tsc não os encontra.
      - name: Gerar tipos das rotas
        working-directory: apps/web
        run: pnpm exec next typegen

      - name: Testar agendamento de campanhas
        working-directory: apps/web
        run: pnpm test:campanhas

      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm exec next build

  database:
    name: Migrations e schema Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js para os testes isolados
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Configurar Deno para validar regras do backend
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - name: Verificar tipos e lint de frete e horários livres
        run: |
          deno check --no-lock --node-modules-dir=none supabase/functions/_shared/frete.ts
          deno check --no-lock --node-modules-dir=none supabase/functions/_shared/horarios.ts
          deno lint supabase/functions/_shared/frete.ts supabase/functions/_shared/horarios.ts

      - name: Testar frete, worker, limpeza e métricas sem produção
        run: node --test supabase/tests/*.test.mjs

      - name: Testar fila de exclusão e permissões no PostgreSQL isolado
        env:
          PGLITE_MODULE: ${{ github.workspace }}/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node supabase/tests/testar-lgpd-worker.mjs
          node supabase/tests/testar-limites-plano.mjs
          node supabase/tests/testar-admin-integracoes.mjs
          node supabase/tests/testar-campanhas-revisao.mjs

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations no banco local
        run: supabase db start

      - name: Validar funções e schema
        run: supabase db lint --local --fail-on error
