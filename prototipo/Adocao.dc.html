<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adoção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111}
a{text-decoration:none;color:inherit}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2.5%}}
@keyframes sway{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
div[style*="border-radius:2"][style*="padding"],div[style*="border-radius:3"][style*="padding"]{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
div[style*="border-radius:2"][style*="padding"]:nth-child(2),div[style*="border-radius:3"][style*="padding"]:nth-child(2){animation-delay:.08s}
div[style*="border-radius:2"][style*="padding"]:nth-child(3),div[style*="border-radius:3"][style*="padding"]:nth-child(3){animation-delay:.16s}
div[style*="border-radius:2"][style*="padding"]:nth-child(4),div[style*="border-radius:3"][style*="padding"]:nth-child(4){animation-delay:.24s}
div[style*="border-radius:2"][style*="padding"]:nth-child(5),div[style*="border-radius:3"][style*="padding"]:nth-child(5){animation-delay:.32s}
svg[viewBox="0 0 200 200"]{animation:bob 3.4s ease-in-out infinite}
svg[stroke="#fff"][viewBox="0 0 24 24"]{transform-origin:50% 50%;animation:sway 5s ease-in-out infinite}
circle[fill-opacity]{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
polyline[stroke="#111"]{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s .25s ease-out forwards}
div[style*="border-radius:4px"][style*="width:"]{transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.7,.2,1) both}
a{transition:transform .18s ease}
a[style*="border-radius:32px"]:hover,a[style*="border-radius:28px"]:hover{transform:translateY(-2px)}
a[style*="border-radius:32px"]:active,a[style*="border-radius:28px"]:active{transform:scale(.97)}
nav a:hover{transform:translateY(-3px)}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#fff;overflow:hidden;display:flex;flex-direction:column">
<div style="position:relative;height:230px;background:#FDE0E6;flex:none;overflow:hidden"><div style="position:absolute;left:24px;top:56px"><a href="Perfil.dc.html" aria-label="Voltar" style="width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></div><div style="position:absolute;left:24px;top:112px;font-size:14px;font-weight:500;color:#2F6F93">Adoção</div><h1 style="position:absolute;left:24px;top:132px;margin:0;font-weight:500;font-size:32px;line-height:1.05;letter-spacing:-0.03em">{{titulo}}</h1><svg style="position:absolute;left:0;bottom:-1px" width="390" height="46" viewBox="0 0 390 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46V26C28 8 56 10 80 24C104 38 132 40 154 26C180 8 214 10 238 26C262 42 300 38 322 22C346 6 372 12 390 24V46z" fill="#fff"/></svg></div><div style="padding:0 24px;display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden">
 <div style="display:flex;gap:8px;overflow:hidden"><sc-for list="{{abas}}" as="aba" hint-placeholder-count="4"><button type="button" onClick="{{aba.escolher}}" style="{{aba.estilo}}">{{aba.nome}}</button></sc-for></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><sc-for list="{{pets}}" as="pet" hint-placeholder-count="4"><a href="AdocaoPet.dc.html" style="display:block"><div style="background:#fff;border:1.5px solid #EEF0F4;border-radius:24px;padding:8px;position:relative"><div style="{{pet.fotoEstilo}}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="1.8"/><path d="M21 16l-5-4-7 6"/></svg></div><span style="position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{pet.coracao}}" stroke="{{pet.coracaoLinha}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></span><div style="padding:8px 4px 2px"><div style="font-size:14px;font-weight:700">[Nome]</div><div style="font-size:12px;color:#5E6878">{{pet.info}}</div><div style="font-size:11px;color:#6A7484;margin-top:2px">ONG [Nome]</div></div></div></a></sc-for></div>
 <a href="EventosMapa.dc.html" style="display:flex;align-items:center;gap:12px;background:#E0F1FA;border-radius:22px;padding:12px 16px;margin-top:auto"><span style="width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">Feira de adoção neste sábado</div><div style="font-size:12px;color:#2F6F93">Veja no mapa de eventos</div></div></a></div><div style="height:28px;flex:none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { aba: 'todos' }; }
  renderVals() {
    const aba = this.state.aba;
    const nomes = [['todos', 'Todos'], ['caes', 'Cães'], ['gatos', 'Gatos'], ['filhotes', 'Filhotes']];
    const titulos = { todos: 'Adote um amigo', caes: 'Adote um aumigo', gatos: 'Adote um miaumigo', filhotes: 'Adote um amigo' };
    const todos = [
      { esp: 'cao', filhote: false, cor: '#9AD6F8', info: 'Cão · [2] anos · médio', fav: true },
      { esp: 'gato', filhote: false, cor: '#EADCFB', info: 'Gata · [1] ano · pequena', fav: false },
      { esp: 'cao', filhote: true, cor: '#FFF0C9', info: 'Cão · [4] meses · filhote', fav: false },
      { esp: 'gato', filhote: true, cor: '#D8F2E3', info: 'Gato · [3] meses · filhote', fav: false }
    ];
    const ok = (p) => aba === 'todos' || (aba === 'caes' && p.esp === 'cao') || (aba === 'gatos' && p.esp === 'gato') || (aba === 'filhotes' && p.filhote);
    return {
      titulo: titulos[aba],
      abas: nomes.map(([id, nome]) => ({
        nome,
        escolher: () => this.setState({ aba: id }),
        estilo: 'flex:none;font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:8px 16px;min-height:36px;cursor:pointer;' + (aba === id ? 'background:#111;color:#fff;border:1.5px solid #111' : 'background:#fff;color:#111;border:1.5px solid #E1E6EE')
      })),
      pets: todos.filter(ok).map((p) => ({
        info: p.info,
        fotoEstilo: 'height:108px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:' + p.cor,
        coracao: p.fav ? '#A3324F' : 'none',
        coracaoLinha: p.fav ? '#A3324F' : '#111'
      }))
    };
  }
}
</script>
</body>
</html>
