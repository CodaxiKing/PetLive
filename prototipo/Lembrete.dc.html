<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111}
input{font-family:inherit}
a{text-decoration:none;color:inherit}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2.5%}}
@keyframes sway{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
div[style*="border-radius:2"][style*="padding"],div[style*="border-radius:3"][style*="padding"]{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
div[style*="border-radius:2"][style*="padding"]:nth-child(2),div[style*="border-radius:3"][style*="padding"]:nth-child(2){animation-delay:.08s}
div[style*="border-radius:2"][style*="padding"]:nth-child(3),div[style*="border-radius:3"][style*="padding"]:nth-child(3){animation-delay:.16s}
div[style*="border-radius:2"][style*="padding"]:nth-child(4),div[style*="border-radius:3"][style*="padding"]:nth-child(4){animation-delay:.24s}
div[style*="border-radius:2"][style*="padding"]:nth-child(5),div[style*="border-radius:3"][style*="padding"]:nth-child(5){animation-delay:.32s}
svg[viewBox="0 0 200 200"]{animation:bob 3.4s ease-in-out infinite}
svg[stroke="#fff"][viewBox="0 0 24 24"]{transform-origin:50% 50%;animation:sway 5s ease-in-out infinite}
circle[fill-opacity]{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
polyline[stroke="#111"]{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s .25s ease-out forwards}
div[style*="border-radius:4px"][style*="width:"]{transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.7,.2,1) both}
a{transition:transform .18s ease}
a[style*="border-radius:32px"]:hover,a[style*="border-radius:28px"]:hover{transform:translateY(-2px)}
a[style*="border-radius:32px"]:active,a[style*="border-radius:28px"]:active{transform:scale(.97)}
nav a:hover{transform:translateY(-3px)}
}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;overflow:hidden">

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">

        <input id="hora" type="text" placeholder="09:00" style="border:0;background:transparent;outline:0;font-size:16px;font-weight:600;padding:2px 0;height:28px;min-width:0">
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-weight:700;font-size:14px">Repetir</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="height:38px;padding:0 14px;border-radius:19px;background:#fff;border:1.5px solid #E1E6EE;box-sizing:border-box;display:flex;align-items:center;font-size:13px;font-weight:600">Não repetir</span>
        <span style="height:38px;padding:0 14px;border-radius:19px;background:#111;color:#fff;display:flex;align-items:center;font-size:13px;font-weight:600">Todo mês</span>
        <span style="height:38px;padding:0 14px;border-radius:19px;background:#fff;border:1.5px solid #E1E6EE;box-sizing:border-box;display:flex;align-items:center;font-size:13px;font-weight:600">A cada 15 dias</span>

    </div>

    <div style="background:#F3F5F8;border-radius:22px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px">

      <div style="width:52px;height:30px;border-radius:15px;background:#111;position:relative;flex:none"><div style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#9AD6F8"></div></div>
    </div>

    <a href="Lembretes.dc.html" style="margin-top:auto;height:64px;border-radius:32px;background:#111;color:#fff;display:flex;align-items:center;padding:0 6px">

      <span style="flex:1;text-align:center;font-weight:600;font-size:17px;padding-right:52px">Criar lembrete</span>

  </div>
