<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lojista, editar serviço</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="Catalogo.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Banho e tosa</h1></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Preço</span><div class="valor num">R$ 85,00</div></label><label class="campo"><span>Duração</span><div class="valor num">1h30</div></label></div>
<div class="lista"><div class="linha-item"><span class="icone neutro"><i class="ph ph-users"></i></span><div class="texto"><b>Vagas por horário</b><small>2 atendimentos juntos</small></div><span style="display:inline-flex;align-items:center;gap:12px;background:var(--papel);border-radius:999px;padding:3px"><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff"><i class="ph ph-minus"></i></span><b class="num">2</b><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tinta);color:#fff"><i class="ph ph-plus"></i></span></span></div></div>
<small style="display:block;font-size:13px;font-weight:600;color:var(--suave);margin:16px 4px 8px">Quem atende</small>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip ativo"><i class="ph ph-check"></i>Ana</span><span class="chip ativo"><i class="ph ph-check"></i>Bruno</span><span class="chip"><i class="ph ph-plus"></i>Profissional</span></div>
<div style="height:14px"></div>
<div class="lista"><div class="linha-item"><span class="icone neutro"><i class="ph ph-timer"></i></span><div class="texto"><b>Intervalo entre atendimentos</b><small>15 minutos</small></div><i class="ph ph-caret-right seta"></i></div><div class="linha-item"><span class="icone neutro"><i class="ph ph-clock"></i></span><div class="texto"><b>Usar horários da loja</b><small>Seg a sáb</small></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div><div class="linha-item"><span class="icone neutro"><i class="ph ph-eye"></i></span><div class="texto"><b>Visível no app</b><small>Tutores podem agendar</small></div><span style="width:48px;height:28px;border-radius:999px;background:var(--tinta);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div></div>

</div>
<div class="rodape"><a class="botao tocavel ">Salvar serviço</a></div>

</div>
</body>
</html>
