<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Criar evento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe">
<div class="topo"><a href="EventosMapa.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Criar evento</h1></div>

<span style="display:block;font-size:13px;font-weight:600;color:var(--suave);margin:0 4px 8px">Tipo</span><div class="chips"><span class="chip ativo">Adoção</span><span class="chip">Vacinação</span><span class="chip">Passeio</span><span class="chip">Encontro</span><span class="chip">Outro</span></div><div style="height:16px"></div>
<label class="campo"><span>Nome do evento</span><div class="valor num">Feira de adoção do Aterro</div></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Dia</span><div class="valor num">08/11</div></label><label class="campo"><span>Horário</span><div class="valor num">9:00 às 13:00</div></label></div>
<label class="campo"><span>Local</span><div class="valor num" style="color:var(--fraco)">Buscar um lugar ou marcar no mapa</div></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo"><span>Entrada</span><div class="valor num">Gratuita</div></label><label class="campo"><span>Vagas</span><div class="valor num">60</div><em>Opcional</em></label></div>
<div class="cartao" style="display:flex;gap:12px;align-items:center;border:1.5px dashed var(--linha);box-shadow:none;background:transparent"><span class="icone neutro"><i class="ph ph-image"></i></span><b style="font-size:15px">Adicionar foto</b></div>
<p class="sub" style="font-size:12px;margin:14px 4px 0">O evento passa por análise antes de aparecer no mapa, em até 1 dia útil.</p>

</div>
<div class="rodape"><a class="botao tocavel ">Enviar para análise</a></div>

</div>
</body>
</html>
