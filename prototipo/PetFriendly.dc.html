<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pet friendly</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111}
a{text-decoration:none;color:inherit}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2.5%}}
@keyframes sway{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
div[style*="border-radius:2"][style*="padding"],div[style*="border-radius:3"][style*="padding"]{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
div[style*="border-radius:2"][style*="padding"]:nth-child(2),div[style*="border-radius:3"][style*="padding"]:nth-child(2){animation-delay:.08s}
div[style*="border-radius:2"][style*="padding"]:nth-child(3),div[style*="border-radius:3"][style*="padding"]:nth-child(3){animation-delay:.16s}
div[style*="border-radius:2"][style*="padding"]:nth-child(4),div[style*="border-radius:3"][style*="padding"]:nth-child(4){animation-delay:.24s}
div[style*="border-radius:2"][style*="padding"]:nth-child(5),div[style*="border-radius:3"][style*="padding"]:nth-child(5){animation-delay:.32s}
svg[viewBox="0 0 200 200"]{animation:bob 3.4s ease-in-out infinite}
svg[stroke="#fff"][viewBox="0 0 24 24"]{transform-origin:50% 50%;animation:sway 5s ease-in-out infinite}
circle[fill-opacity]{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
polyline[stroke="#111"]{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s .25s ease-out forwards}
div[style*="border-radius:4px"][style*="width:"]{transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.7,.2,1) both}
a{transition:transform .18s ease}
a[style*="border-radius:32px"]:hover,a[style*="border-radius:28px"]:hover{transform:translateY(-2px)}
a[style*="border-radius:32px"]:active,a[style*="border-radius:28px"]:active{transform:scale(.97)}
nav a:hover{transform:translateY(-3px)}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#fff;overflow:hidden;display:flex;flex-direction:column">
<div style="position:relative;height:196px;background:#9AD6F8;flex:none;overflow:hidden"><div style="position:absolute;left:24px;top:56px"><a href="Mapa.dc.html" aria-label="Voltar" style="width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></div><div style="position:absolute;left:24px;top:104px;font-size:14px;font-weight:500;color:#1A5577;z-index:1">Mapa</div><h1 style="position:absolute;left:24px;top:124px;margin:0;font-weight:500;font-size:32px;line-height:1.05;letter-spacing:-0.03em;z-index:1">Pet friendly</h1><svg style="position:absolute;left:0;bottom:-1px" width="390" height="46" viewBox="0 0 390 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46V26C28 8 56 10 80 24C104 38 132 40 154 26C180 8 214 10 238 26C262 42 300 38 322 22C346 6 372 12 390 24V46z" fill="#fff"/></svg></div><div style="padding:0 24px;display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden">
 <div style="flex:none;display:flex;align-items:center;gap:10px;height:50px;border-radius:25px;background:#F3F5F8;padding:0 16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><label for="regiao" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar por bairro ou região</label><input id="regiao" type="text" value="{{q}}" onInput="{{digitar}}" placeholder="Buscar por bairro ou região" style="flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:inherit;font-size:14px;font-weight:500;height:30px"></div>
 <div style="flex:none;display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;font-weight:700">{{titulo}}</span><span style="font-size:12px;color:#566070;font-weight:600">{{ordem}}</span></div>
 <div style="flex:none;display:flex;gap:8px;overflow:hidden"><sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button type="button" onClick="{{c.escolher}}" style="{{c.estilo}}">{{c.nome}}</button></sc-for></div>
 <sc-for list="{{lugares}}" as="it" hint-placeholder-count="4"><div style="flex:none;display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid #EEF0F4;border-radius:22px;padding:8px"><div style="{{it.fotoEstilo}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="1.8"/><path d="M21 16l-5-4-7 6"/></svg></div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">{{it.nome}}</div><div style="font-size:12px;color:#566070">{{it.info}}</div><div style="margin-top:4px"><span style="display:inline-block;font-size:11px;font-weight:700;background:#E0F1FA;color:#1A5577;border-radius:999px;padding:4px 10px;white-space:nowrap">{{it.tag}}</span></div></div></div></sc-for>
 <sc-if value="{{vazio}}" hint-placeholder-val="{{false}}"><div style="background:#F3F5F8;border-radius:22px;padding:16px;text-align:center"><div style="font-weight:700;font-size:15px">Nada encontrado</div><div style="font-size:12px;color:#566070;margin-top:4px">Tente outro bairro ou limpe os filtros.</div></div></sc-if>
 <div style="font-size:11px;line-height:1.45;color:#566070;text-align:center;padding:0 6px">Informação do Google. Confirme com o local antes de ir.</div></div><div style="padding:12px 24px 28px;flex:none"><a href="Mapa.dc.html" style="height:64px;border-radius:32px;background:#111;color:#fff;display:flex;align-items:center;padding:0 8px;font-weight:700;font-size:16px"><span style="width:48px;height:48px;border-radius:50%;background:#9AD6F8;display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span><span style="flex:1;text-align:center;margin-right:48px;white-space:nowrap">Ver no mapa</span></a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'todos', perto: true, q: '' }; }
  renderVals() {
    const { cat, perto, q } = this.state;
    const todos = [
      { nome: '[Nome do restaurante]', t: 'restaurante', rot: 'Restaurante', km: 0.9, nota: '[4,5]', bairro: 'Ipanema', tag: 'Aceita cães e gatos', cor: '#FFF0C9' },
      { nome: '[Nome do parque]', t: 'parque', rot: 'Parque', km: 1.1, nota: '[4,7]', bairro: 'Tijuca', tag: 'Aceita cães', cor: '#CFE8FB' },
      { nome: '[Nome do café]', t: 'restaurante', rot: 'Restaurante', km: 1.8, nota: '[4,6]', bairro: 'Copacabana', tag: 'Aceita pets', cor: '#FFF0C9' },
      { nome: '[Nome da praia]', t: 'praia', rot: 'Praia', km: 2.3, nota: '[4,6]', bairro: 'Leblon', tag: 'Área para cães', cor: '#D8F2E3' },
      { nome: '[Nome do hotel]', t: 'hotel', rot: 'Hotel', km: 3.1, nota: '[4,4]', bairro: 'Copacabana', tag: 'Aceita pets', cor: '#EADCFB' },
      { nome: '[Nome do parque]', t: 'parque', rot: 'Parque', km: 4.0, nota: '[4,8]', bairro: 'Flamengo', tag: 'Aceita cães', cor: '#CFE8FB' }
    ];
    const termo = q.trim().toLowerCase();
    let lista = todos.filter((x) => (cat === 'todos' || x.t === cat) && (!termo || x.bairro.toLowerCase().includes(termo) || x.rot.toLowerCase().includes(termo)));
    lista = lista.sort((a, b) => (perto ? a.km - b.km : a.bairro.localeCompare(b.bairro)));
    const cats = [['todos', 'Todos'], ['parque', 'Parques'], ['praia', 'Praias'], ['restaurante', 'Restaurantes'], ['hotel', 'Hotéis']];
    const chip = (on) => 'flex:none;font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer;' + (on ? 'background:#111;color:#fff;border:1.5px solid #111' : 'background:#fff;color:#111;border:1.5px solid #E1E6EE');
    return {
      q,
      digitar: (e) => this.setState({ q: e.target.value }),
      titulo: termo ? 'Resultados para “' + q.trim() + '”' : 'Perto de você · Rio de Janeiro',
      ordem: perto ? 'Mais próximos primeiro' : 'Em ordem de bairro',
      vazio: lista.length === 0,
      chips: [{ nome: perto ? '● Perto de mim' : 'Perto de mim', escolher: () => this.setState({ perto: !perto }), estilo: perto ? 'flex:none;font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer;background:#9AD6F8;color:#111;border:1.5px solid #7CC8F0' : chip(false) }].concat(cats.map(([id, nome]) => ({ nome, escolher: () => this.setState({ cat: id }), estilo: chip(cat === id) }))),
      lugares: lista.map((x) => ({
        nome: x.nome,
        info: x.rot + ' · ' + x.bairro + ' · ' + String(x.km).replace('.', ',') + ' km · ' + x.nota + ' ★',
        tag: x.tag,
        fotoEstilo: 'width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;background:' + x.cor
      }))
    };
  }
}
</script>
</body>
</html>
