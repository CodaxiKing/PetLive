 style="position:absolute;right:6px;bottom:4px;font-size:10px;color:#566070;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:4px">© OpenStreetMap</span></div><span style="position:absolute;left:160px;top:70px;width:28px;height:28px;border-radius:50%;background:var(--ceu-texto);border:4px solid #fff;box-shadow:0 0 0 10px rgba(20,80,111,.18)"></span><span style="position:absolute;left:12px;bottom:12px"><span class="selo neutro"><i class="ph-bold ph-crosshair"></i>Sua localização atual</span></span></div>
