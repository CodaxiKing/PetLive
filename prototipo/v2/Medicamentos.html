<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Medicamentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">

<div class="rolagem sobe">
  <div class="topo"><a href="Pet.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><h1>Remédios do Rex</h1></div>
  <div class="cartao" style="background:var(--tinta);color:#fff">
    <div style="display:flex;align-items:baseline;justify-content:space-between"><b style="font-size:16px">Hoje</b><span class="num" style="font-size:13px;color:#C9D0DB">2 de 4 doses</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px"><span style="height:8px;border-radius:999px;background:var(--ceu)"></span><span style="height:8px;border-radius:999px;background:var(--ceu)"></span><span style="height:8px;border-radius:999px;background:#2A3445"></span><span style="height:8px;border-radius:999px;background:#2A3445"></span></div>
    <p class="num" style="font-size:13px;color:#C9D0DB;margin:12px 0 0">Próxima: Antibiótico às 14:00</p>
  </div>
  <div class="secao"><h2>Em uso</h2></div>
  <div class="pilha">
  <div class="cartao">
    <div style="display:flex;align-items:center;gap:12px"><span class="icone saude"><i class="ph ph-pill"></i></span><div style="flex:1"><b style="font-size:16px">Antibiótico</b><p class="sub" style="font-size:13px">5 ml · 12 em 12 h · até 05/11</p></div><i class="ph ph-dots-three seta"></i></div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><span class="selo ok num" style="height:30px"><i class='ph-bold ph-check'></i>08:00</span><span class="selo neutro num" style="height:30px">20:00</span></div></div>
  <div class="cartao">
    <div style="display:flex;align-items:center;gap:12px"><span class="icone saude"><i class="ph ph-pill"></i></span><div style="flex:1"><b style="font-size:16px">Antipulgas</b><p class="sub" style="font-size:13px">1 comprimido · 1 vez ao dia</p></div><i class="ph ph-dots-three seta"></i></div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><span class="selo ok num" style="height:30px"><i class='ph-bold ph-check'></i>08:00</span></div></div>
  <div class="cartao">
    <div style="display:flex;align-items:center;gap:12px"><span class="icone saude"><i class="ph ph-pill"></i></span><div style="flex:1"><b style="font-size:16px">Protetor de fígado</b><p class="sub" style="font-size:13px">1/2 comprimido · 12 em 12 h</p></div><i class="ph ph-dots-three seta"></i></div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><span class="selo neutro num" style="height:30px">09:00</span><span class="selo neutro num" style="height:30px">21:00</span></div></div>
  </div>
</div>
<div class="rodape"><a class="botao tocavel"><i class="ph ph-plus"></i>Novo remédio</a></div>
</div>
</body>
</html>
