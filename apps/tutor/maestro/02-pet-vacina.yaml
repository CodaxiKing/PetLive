# Fluxo 02: cadastrar pet -> abrir ficha -> aba Saúde -> registrar vacina.
# Depende do 01 (sessão criada); nome do pet é único por execução.
appId: app.petlive.tutor
name: 02 pet e vacina
---
- runScript: scripts/gerar-pet.js
- launchApp
- tapOn: "Pets"
- extendedWaitUntil:
    visible: "Meus pets"
    timeout: 30000
- tapOn:
    id: "Cadastrar novo pet"
    optional: true
- tapOn:
    text: "Cadastrar pet"
    optional: true
- extendedWaitUntil:
    visible: "Conheça seu pet"
    timeout: 15000
- tapOn: "Ex.: Rex"
- inputText: "${PET_E2E}"
- hideKeyboard
- tapOn: "Continuar"
- tapOn: "Salvar pet"
- extendedWaitUntil:
    visible: "${PET_E2E}"
    timeout: 30000
- tapOn:
    id: "Abrir ${PET_E2E}"
- extendedWaitUntil:
    visible: "Vacinas"
    timeout: 15000
- tapOn: "Registrar vacina"
- extendedWaitUntil:
    visible: "Qual vacina?"
    timeout: 15000
- tapOn: "+ Outra"
- tapOn: "Ex.: Leishmaniose"
- inputText: "Antirrábica E2E"
- hideKeyboard
- tapOn:
    text: "/^Salvar vacina$/"
- extendedWaitUntil:
    visible: "Antirrábica E2E"
    timeout: 30000
- takeScreenshot: "02-vacina-ok.png"
