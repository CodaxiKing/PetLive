<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lojista, escolher serviços</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
<div class="tela">
<div class="rolagem sobe"><div style="display:flex;align-items:center;gap:12px;margin-bottom:22px"><a href="LojaTipo.html" class="redondo" aria-label="Voltar"><i class="ph ph-arrow-left"></i></a><div style="flex:1;display:flex;gap:4px"><span style="flex:1;height:6px;border-radius:999px;background:var(--tinta)"></span><span style="flex:1;height:6px;border-radius:999px;background:var(--tinta)"></span><span style="flex:1;height:6px;border-radius:999px;background:var(--tinta)"></span><span style="flex:1;height:6px;border-radius:999px;background:var(--tinta)"></span><span style="flex:1;height:6px;border-radius:999px;background:#D5DAE2"></span></div><small class="num" style="font-weight:700;color:var(--suave)">4 de 5</small></div><h1 class="titulo" style="font-size:30px">Quais serviços você faz?</h1><p class="sub" style="margin:8px 0 20px">Cada serviço tem a sua forma de reserva.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="cartao" style="background:var(--tinta);color:#fff;padding:14px;position:relative"><span style="font-size:26px"><i class="ph ph-bathtub"></i></span><b style="display:block;font-size:15px;margin-top:8px">Banho e tosa</b><small style="font-size:12px;color:#C9D0DB">Por horário</small><span style=position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ceu);color:var(--tinta);display:grid;place-items:center><i class="ph ph-check" style=font-size:13px></i></span></div><div class="cartao" style="background:var(--tinta);color:#fff;padding:14px;position:relative"><span style="font-size:26px"><i class="ph ph-dog"></i></span><b style="display:block;font-size:15px;margin-top:8px">Passeador</b><small style="font-size:12px;color:#C9D0DB">Passeio de 30 ou 60 min</small><span style=position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ceu);color:var(--tinta);display:grid;place-items:center><i class="ph ph-check" style=font-size:13px></i></span></div>
<div class="cartao" style="background:#fff;color:var(--tinta);padding:14px;position:relative"><span style="font-size:26px"><i class="ph ph-sun"></i></span><b style="display:block;font-size:15px;margin-top:8px">Creche pet</b><small style="font-size:12px;color:var(--suave)">Dia inteiro ou meio</small></div><div class="cartao" style="background:var(--tinta);color:#fff;padding:14px;position:relative"><span style="font-size:26px"><i class="ph ph-moon-stars"></i></span><b style="display:block;font-size:15px;margin-top:8px">Hotelzinho</b><small style="font-size:12px;color:#C9D0DB">Diárias com check-in</small><span style=position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ceu);color:var(--tinta);display:grid;place-items:center><i class="ph ph-check" style=font-size:13px></i></span></div>
<div class="cartao" style="background:#fff;color:var(--tinta);padding:14px;position:relative"><span style="font-size:26px"><i class="ph ph-stethoscope"></i></span><b style="display:block;font-size:15px;margin-top:8px">Consulta</b><small style="font-size:12px;color:var(--suave)">Por horário</small></div><div class="cartao" style="background:#fff;color:var(--tinta);padding:14px;position:relative"><span style="font-size:26px"><i class="ph ph-syringe"></i></span><b style="display:block;font-size:15px;margin-top:8px">Vacinação</b><small style="font-size:12px;color:var(--suave)">Por horário</small></div>
</div>
<div class="cartao" style="margin-top:10px;border:1.5px dashed var(--linha);box-shadow:none;background:transparent;display:flex;gap:10px;align-items:center"><span class="icone neutro"><i class="ph ph-plus"></i></span><b style="font-size:14px">Outro serviço (adestramento e outros)</b></div>
</div><div class="rodape"><a href="LojaPublicar.html" class="botao tocavel ">Continuar com 3 serviços</a></div>
</div>
